name: Push Docker image 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

steps:
# 1. Check out our repository so the workflow can access it
  - name: Check out repository
    uses: actions/checkout@v4
 
# 2. Set up a specific version of Python
  - name: Set up Python
    uses: actions/setup-python@v5
    with: 
      python-version: '3.10'
 
# 3. Install dependencies
  - name: Install dependencies
    run: |
        python -m pip install ----upgrade pip
        pip install -r requirements.txt
 
# 4. Run the tests
  - name: Run test with pytest
    run: | 
        pytest



push-to-repo:
#3 runs-on: ubuntu-latest
  need: build-and-test
#Only run on every push to the main branch
  if: github.event.name == 'push' 
  steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push : true
        platforms: linux/amd64,linux/arm64
        tags: bniang/fast-api-docker-example:latest